<h1 mat-dialog-title>{{ls.l('AddTrackingLink.AddNewTrackingLink')}}</h1>
<div mat-dialog-content>
    <mat-form-field>
        <mat-label>{{ls.l('AddTrackingLink.EnterTrackingLink')}}</mat-label>
        <input matInput [(ngModel)]="data.link" [formControl]="url" required>
        <mat-error *ngIf="url.hasError('required')">
            {{ls.l('AddTrackingLink.UrlRequired')}}
        </mat-error>
        <mat-error *ngIf="url.hasError('pattern')">
            {{ls.l('AddTrackingLink.UrlPatternInvalid')}}
        </mat-error>
    </mat-form-field>
</div>
<div mat-dialog-actions>
    <button class="btn btn-default" (click)="onNoClick()">{{ls.l('Cancel')}}</button>
    <button class="btn btn-primary"
            [mat-dialog-close]="data.link"
            [disabled]="!url.valid"
            cdkFocusInitial>
        {{ls.l('AddLink')}}
    </button>
</div>
